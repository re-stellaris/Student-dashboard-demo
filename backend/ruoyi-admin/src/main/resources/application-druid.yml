# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
                username: root
                password: password
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                # 若依原值为 enabled: true / 账号 ruoyi / 口令 123456 / allow 为空（允许所有来源）。
                # 这里改为环境变量注入：默认值保持开发期可用，生产由 profile 关闭或改强口令。
                # 关闭方式：DRUID_STAT_VIEW_ENABLED=false（application-docker.yml 已默认关闭）。
                enabled: ${DRUID_STAT_VIEW_ENABLED:true}
                # 设置白名单，不填则允许所有访问；生产建议填内网网段，如 172.16.0.0/12
                allow: ${DRUID_ALLOW:}
                url-pattern: /druid/*
                # 控制台管理用户名和密码（禁止使用默认口令上线）
                login-username: ${DRUID_LOGIN_USERNAME:ruoyi}
                login-password: ${DRUID_LOGIN_PASSWORD:123456}
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true