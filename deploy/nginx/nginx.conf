# =====================================================================
# 若依教育平台 —— 前端网关（Nginx 1.29）
# ---------------------------------------------------------------------
# 本文件被复制为 /etc/nginx/conf.d/default.conf，由 nginx.conf 的 http{} 块包含，
# 因此这里只写 server 级指令，不要写 user/worker_processes 之类的全局指令。
#
# 提供的两个后端 API 前缀（都已支持）：
#   /prod-api/**  ->  http://backend:8080/**   （前端 .env.production: VITE_APP_BASE_API=/prod-api）
#   /api/**       ->  http://backend:8080/**   （外部调用方 / 第三方集成的简化前缀）
# 两者都只剥离前缀，其余路径原样透传，例如：
#   /prod-api/edu/student/list  ->  /edu/student/list
#   /api/system/user/getInfo    ->  /system/user/getInfo
# 后端 Controller 的 /edu/** 路径因此保持不变。
# =====================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # 与若依 application.yml 的 spring.servlet.multipart.max-file-size: 10MB 对齐。
    # 注意：multipart 编码有额外开销，上传「正好 10MB」的文件会被 413 拒绝；
    # 如果业务确实需要传满 10MB，请把这里调到 12m（总请求 20MB 则调到 25m）。
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # ---------------- gzip ----------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    # 只压缩文本类；woff2/png/jpg 本身已压缩，再 gzip 只是浪费 CPU
    gzip_types        text/plain text/css text/xml text/javascript
                      application/javascript application/json
                      application/xml application/xml+rss
                      application/manifest+json image/svg+xml;

    # ---------------- 安全响应头 ----------------
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 如需在第三方系统里用 iframe 内嵌本平台，请保持下面一行注释状态
    # （SAMEORIGIN 会阻止跨站 iframe 嵌套并显示空白页）；不内嵌时建议打开：
    # add_header X-Frame-Options SAMEORIGIN always;
    # 如需生产环境 HSTS，请在真正启用 HTTPS（TLS 终止在更外层）后再打开：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------------- 反向代理公共头 ----------------
    # 在 server 级别统一定义，各 location 只写 proxy_pass，避免重复。
    # Host 用 $host（已去掉端口）；若后端有依赖完整 Host（含端口）的重定向，
    # 可改为 $http_host。
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Port  $server_port;
    proxy_set_header   Connection        "";
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    # 导出 Excel / 文件下载走流式返回，关闭缓冲可降低内存占用与首字节延迟
    proxy_buffering       off;

    # ---------------- API：/prod-api/ ----------------
    # location 与 proxy_pass 都以 / 结尾 => 只剥离 /prod-api 前缀。
    # 注意：nginx 仅在启动时解析一次 backend 这个域名。若重建了 backend 容器
    # （docker compose up -d --build backend 会分配新 IP），前端会持续 502，
    # 执行 `docker compose restart frontend` 即可恢复。
    location /prod-api/ {
        proxy_pass http://backend:8080/;
    }

    # ---------------- API：/api/ ----------------
    location /api/ {
        proxy_pass http://backend:8080/;
    }

    # ---------------- 若依上传文件 ----------------
    # 后端 ResourcesConfig 把 /profile/** 映射到 ruoyi.profile（容器内 /app/data/uploadPath）。
    # 前端部分位置会直接用裸 URL 访问头像/附件，这里一并转发，避免 404。
    location /profile/ {
        proxy_pass http://backend:8080/profile/;
    }

    # ---------------- 带 hash 的构建产物：长期强缓存 ----------------
    # vite.config.ts:
    #   chunkFileNames:  static/js/[name]-[hash].js
    #   entryFileNames:  static/js/[name]-[hash].js
    #   assetFileNames:  static/[ext]/[name]-[hash].[ext]
    # 文件名内含 hash，内容变化必然换名，因此可以 immutable 缓存一年。
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 图片/字体等（多为 public/ 下不带 hash 的资源，缓存适度放短）
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|ttf|otf|eot|woff2?|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ---------------- 入口 HTML 绝不缓存 ----------------
    # 否则发版后浏览器会拿着旧 index.html 去请求已删除的旧 hash 资源。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        # 关掉 ETag / If-Modified-Since，避免返回 304 让浏览器继续用旧 HTML
        etag off;
        if_modified_since off;
    }

    # ---------------- SPA history 模式回退 ----------------
    # 前端使用 vue-router history 模式，/education/dashboard 之类的深链接
    # 在磁盘上并不存在，必须回退到 /index.html 交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件（.env、.git 之类）一律拒绝
    location ~ /\.(?!well-known) {
        deny all;
    }
}
